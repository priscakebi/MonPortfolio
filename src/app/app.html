<div class="progress" [style.transform]="'scaleX(' + progress() + ')'"></div>

<header class="navbar" [class.scrolled]="scrolled()" [class.open]="menuOpen()">
  <a href="#home" class="logo" (click)="menuOpen.set(false)">
    <span class="logo-mark">{{ profile.initials }}</span>
    <span class="logo-name">{{ profile.name }}</span>
  </a>

  <nav id="main-nav">
    @for (link of links; track link.id) {
      <a
        [href]="'#' + link.id"
        [class.active]="activeSection() === link.id"
        [attr.aria-current]="activeSection() === link.id ? 'true' : null"
        (click)="menuOpen.set(false)"
      >
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="actions">
    <button
      type="button"
      class="icon-btn"
      (click)="toggleTheme()"
      [attr.aria-label]="theme() === 'dark' ? 'Passer en thème clair' : 'Passer en thème sombre'"
    >
      @if (theme() === 'dark') {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      }
    </button>

    <button
      type="button"
      class="icon-btn burger"
      (click)="menuOpen.set(!menuOpen())"
      aria-controls="main-nav"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <app-home />
  <app-projects />
  <app-education />
  <app-contact />
</main>

<footer class="footer">
  <p>© {{ year }} {{ profile.name }} — Fait avec Angular & ♥</p>
  <a href="#home" class="to-top" aria-label="Revenir en haut">↑</a>
</footer>
